name: Advisory evidence review

# Privileged events intentionally execute ONLY trusted main-branch code.
# PR body, commits, and linked reports are parsed as untrusted text only.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["Validate OKF and diary"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

jobs:
  evidence-merge-gate:
    name: advisory-evidence-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted main-branch gate only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Evaluate current PR head, issue, CI and branch rules (advisory)
        uses: actions/github-script@v7
        with:
          script: |
            const gate = require(process.env.GITHUB_WORKSPACE + "/tools/ci/merge-gate.cjs");
            await gate.run({github, context, core});
