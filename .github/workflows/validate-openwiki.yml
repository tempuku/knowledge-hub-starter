name: Validate OKF and diary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwiki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-openwiki:
    name: validate-openwiki
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: tools/okf/package-lock.json
      - name: Test merge gate policy (negative and positive fixtures)
        run: node --test tools/ci/merge-gate.test.cjs
      - name: Install pinned OKF validator
        run: sh tools/okf/setup.sh
      - name: Test Knowledge Hub frontmatter validation
        run: node --test tools/okf/knowledge-frontmatter.test.mjs
      - name: Validate all staged OpenWiki pages and links
        run: sh .githooks/pre-commit
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/diary/requirements.txt
      - name: Install diary builder dependencies
        run: python -m pip install -r tools/diary/requirements.txt
      - name: Build and smoke-test private diary locally in CI
        run: |
          python tools/diary/build.py
          python tools/diary/test_build.py
      - name: Check browser JavaScript syntax and iOS 12 compatibility
        run: |
          node --check site/app.js
          node --check site/sw.js
          python tools/diary/test_ios12.py
      - name: Install headless Chromium browser test tooling
        run: |
          python -m pip install -r tools/diary/requirements-ui.txt
          python -m playwright install --with-deps chromium webkit
      - name: Test responsive iPhone/iPad/desktop layout and diary interaction
        run: python tools/diary/test_ui.py
      - name: Test the same app in WebKit (modern Safari engine)
        run: DIARY_BROWSER=webkit python tools/diary/test_ui.py
      - name: Verify public-only export excludes private notes
        run: |
          python tools/diary/build.py --output-dir dist-public --public-only
          python tools/diary/test_build.py --output-dir dist-public --public-only
          python tools/diary/test_publication.py dist-public
