[project]
name = "knowledge-hub-starter"
version = "0.0.0"
description = "Git-backed OKF v0.2 knowledge base and static diary"
requires-python = ">=3.10"
dependencies = [
    # Keep in sync with tools/diary/requirements.txt (used by required CI).
    "PyYAML==6.0.3",
]

[dependency-groups]
# Optional browser tooling for agent visual inspection, not a test suite;
# omitted from fast CI and the default Docker test image.
ui = [
    "playwright==1.56.0",
]

[tool.uv]
# This repository is a collection of scripts, not an installable package.
package = false
