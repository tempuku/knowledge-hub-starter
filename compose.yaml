name: knowledge-hub

services:
  # Required-CI parity. The repository is bind-mounted so the tests exercise
  # the working tree, its Git history and origin/main exactly like CI.
  tests:
    build:
      context: .
      target: test
    image: knowledge-hub-tests:local
    working_dir: /workspace
    volumes:
      - .:/workspace
    init: true
    command: ["ci"]

  # Optional Chromium/WebKit environment for an agent's direct UI inspection.
  # Larger image; never used by required CI or the tests service.
  ui:
    build:
      context: .
      target: ui
    image: knowledge-hub-ui:local
    working_dir: /workspace
    volumes:
      - .:/workspace
    init: true
    command: ["browser-shell"]
