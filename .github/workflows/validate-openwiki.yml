name: Validate OKF and diary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwiki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-openwiki:
    name: validate-openwiki
    # Lightweight schema, unit, projection and public privacy validation only.
    # Browser and physical-device checks are opt-in local acceptance tests.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KH_ACCEPTANCE_REPORT_DIR: acceptance-reports
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: tools/okf/package-lock.json
      - name: Test merge gate policy (negative and positive fixtures)
        run: node --test tools/ci/merge-gate.test.cjs
      - name: Test automated PR readiness safety (no approval or merge)
        run: node --test tools/ci/auto-ready.test.cjs
      - name: Install pinned OKF validator
        run: sh tools/okf/setup.sh
      - name: Test Knowledge Hub frontmatter validation
        run: node --test tools/okf/knowledge-frontmatter.test.mjs
      - name: Validate all staged OpenWiki pages and links
        run: sh .githooks/pre-commit
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/diary/requirements.txt
      - name: Verify integrated #37 evidence ledger structure (pending is not acceptance)
        run: |
          python scripts/check_integrated_acceptance.py
          python -m unittest discover -s tests -p 'test_integrated_acceptance.py' -v
      - name: Install diary builder dependencies
        run: python -m pip install -r tools/diary/requirements.txt
      - name: Test integrated real CLI-MCP Git, privacy and no-Git projection chain
        run: python -m unittest discover -s tests -p 'test_issue37_integration.py' -v
      - name: Verify deterministic P16 synthetic fixture at small smoke scale (not benchmark)
        run: python -m unittest discover -s tests -p 'test_p16_fixture.py' -v
      - name: "Validate reviewed issue #35 inventory and mutation tests"
        run: |
          python scripts/inventory_legacy.py --revision de749bed9053dd4bc9f96fee3cb7f816e5bdebcb --check
          python scripts/validate_inventory.py --manifest migration/records-v1.json --report-json "$RUNNER_TEMP/inventory-validation.json"
          python -m unittest discover -s tests -p 'test_validate_inventory.py' -v
      - name: Upload reviewed inventory validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-inventory-validation
          path: ${{ runner.temp }}/inventory-validation.json
          if-no-files-found: warn
      - name: Rehearse #36 frozen-source migration in disposable private Git copies
        run: python -m unittest discover -s tests -p 'test_rehearse_migration.py' -v
      - name: Test v1 storage schemas and histories in disposable Git repositories
        run: python -m unittest discover -s tools/records -p 'test_*.py' -v
      - name: Install pinned official MCP Python SDK for real client smoke
        run: python -m pip install 'mcp==1.30.0'
      - name: Test #40 official SDK client against disposable Git
        run: KH_ISSUE40_REPORT="$RUNNER_TEMP/issue40-client-smoke.json" python -m unittest discover -s tests -p 'test_issue40_mcp_client.py' -v
      - name: Upload sanitized #40 real-client transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue40-real-mcp-client-smoke
          path: ${{ runner.temp }}/issue40-client-smoke.json
          if-no-files-found: warn
      - name: Test M-04 maintenance denial for legacy and v1 writers
        run: python -m unittest discover -s tests -p 'test_cutover_maintenance.py' -v
      - name: Test M-04 exact-head local CAS and failure injection
        run: python -m unittest discover -s tools/cutover -p 'test_*.py' -v
      - name: Test deterministic projection primitives (#31)
        run: python -m unittest discover -s tools/projection -p 'test_*.py' -v
      - name: Upload projection and privacy acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-projection-acceptance
          path: acceptance-reports
          if-no-files-found: warn
      - name: Smoke-test immutable native projections for repository source
        run: |
          python tools/projection/build.py --destination "$RUNNER_TEMP/native-private" --revision HEAD --mode private
          python tools/projection/build.py --destination "$RUNNER_TEMP/native-public" --revision HEAD --mode public
          python tools/projection/sourcebundle.py --root "$GITHUB_WORKSPACE" --revision HEAD --output "$RUNNER_TEMP/native.bundle.json" --receipt-output "$RUNNER_TEMP/native.receipt.json"
          native_receipt_pin=$(python -c 'import hashlib,os,pathlib;print(hashlib.sha256((pathlib.Path(os.environ["RUNNER_TEMP"])/"native.receipt.json").read_bytes()).hexdigest())')
          python tools/projection/build.py --destination "$RUNNER_TEMP/native-bundle" --bundle "$RUNNER_TEMP/native.bundle.json" --receipt "$RUNNER_TEMP/native.receipt.json" --receipt-sha256 "$native_receipt_pin" --mode private
          diff -r "$RUNNER_TEMP/native-private/g" "$RUNNER_TEMP/native-bundle/g"
      - name: Validate v1 source records and append-only trusted-base prefix
        run: |
          BASE="$(git merge-base HEAD origin/main)"
          python tools/records/validate_v1.py --base "$BASE"
      - name: Build and smoke-test private diary locally in CI
        run: |
          python tools/diary/build.py
          python tools/diary/test_build.py
      - name: Check browser JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/sw.js
      - name: Check generated-v1 browser JavaScript syntax
        run: |
          node --check site/v1.js
          node --check site/v1_data.js
          node --check site/v1_diary.js
          node --check site/v1_markdown.js
      - name: Test generated-v1 data cache and service-worker safety
        run: node --test site/sw.test.cjs site/v1_data.test.js site/v1_diary.test.js
      - name: Verify public-only export excludes private notes
        run: |
          python tools/diary/build.py --output-dir dist-public --public-only
          python tools/diary/test_build.py --output-dir dist-public --public-only
          python tools/diary/publish_v1.py --output-dir dist-public
          python tools/diary/test_publication.py dist-public
