name: Publish approved Knowledge Hub preview

# Only a public-only export may be published. The source repository stays private.
# Pages hosting must first be enabled under repository Settings > Pages.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "site/**"
      - "tools/diary/**"
      - "openwiki/journal/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-hub-pages
  cancel-in-progress: false

jobs:
  build-public:
    name: Build and audit public-only diary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/diary/requirements.txt

      - name: Install pinned diary dependency
        run: python -m pip install -r tools/diary/requirements.txt

      - name: Build only explicitly public OKF records
        run: python tools/diary/build.py --public-only --output-dir dist-public

      - name: Validate built content, privacy, and publication allowlist
        run: |
          python tools/diary/test_build.py --output-dir dist-public --public-only
          python tools/diary/test_publication.py dist-public
          python tools/diary/test_ios12.py

      - name: Upload safe static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-public

  deploy:
    name: Deploy approved preview to HTTPS
    needs: build-public
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages (requires prior owner enablement)
        uses: actions/configure-pages@v5

      - name: Deploy the approved public-only artifact
        id: deployment
        uses: actions/deploy-pages@v4
